<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders | VyaparSync</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="style.css?v=6">
  <style>
    .orders-container {
      max-width: 800px;
      margin: 40px auto;
      background: var(--card-bg);
      padding: 30px;
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      transition: var(--transition);
    }
    
    .order-card {
      border: 1px solid rgba(0,0,0,0.05);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-color);
      transition: var(--transition);
    }

    body.dark .order-card {
        border-color: rgba(255,255,255,0.05);
    }

    .order-card:hover {
        transform: translateY(-3px);
        box-shadow: var(--shadow);
    }
    
    .order-info h3 { margin: 0 0 8px 0; color: var(--text-main); font-size: 18px; }
    .order-info p { margin: 4px 0; color: var(--text-muted); font-size: 14px; }
    
    .status-badge {
      padding: 8px 16px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 14px;
      display: inline-block;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    
    .status-pending  { background: rgba(255, 153, 0, 0.1);  color: #e67e22; border: 1px solid #e67e22; }
    .status-shipped   { background: rgba(46, 204, 113, 0.1); color: #27ae60; border: 1px solid #2ecc71; }
    .status-delivered { background: rgba(46, 204, 113, 0.15); color: #16a085; border: 1px solid #1abc9c; }
    .status-cancelled { background: rgba(231, 76, 60, 0.1);  color: #c0392b; border: 1px solid #e74c3c; }
  </style>

  <meta name="theme-color" content="#ff6a00">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <script>if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');</script>
  <link rel="manifest" href="/manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh;">

  <header style="max-width: 800px; margin: 20px auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; background: transparent; box-shadow: none; position: static;">
    <h1 style="color: var(--primary); margin: 0; font-size: 28px;">🛍 VyaparSync</h1>
    <div style="display: flex; gap: 15px; align-items: center;">
        <button onclick="toggleDark()" style="width: auto; padding: 8px 15px; background: #2d3436; color: white; border-radius: 8px; margin: 0; cursor: pointer; border: none;">🌙 Dark</button>
        <a href="index.html" style="text-decoration: none; background: var(--primary); color: white; padding: 10px 20px; border-radius: 20px; font-weight: bold; font-size: 14px;">⬅ Back to Store</a>
    </div>
  </header>

  <div class="orders-container">
    <h2 style="margin-top: 0; border-bottom: 2px solid rgba(0,0,0,0.05); padding-bottom: 15px; color: var(--text-main);">My Order History 📦</h2>
    <p style="font-size: 14px; color: var(--text-muted); margin-top: -10px; margin-bottom: 20px;">Need help with an order? Contact us at <a href="mailto:vyaparsync.support@gmail.com" style="color: var(--primary); text-decoration: underline;">vyaparsync.support@gmail.com</a></p>
    
    <div id="customerOrdersList">
        <p style="text-align: center; color: var(--text-muted); padding: 40px 0;">Loading your orders...</p>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<script src="script.js?v=99"></script>


<footer style="background: var(--nav-bg); color: white; text-align: center; padding: 20px 5%; margin-top: auto;">
  <p style="margin: 0; font-size: 14px;">
    &copy; 2026 VyaparSync. All rights reserved. | <a href="about.html" style="color: var(--primary); text-decoration: none; font-weight: bold;">About / How it works</a> | <a href="terms.html" style="color: var(--primary); text-decoration: none; font-weight: bold;">Terms</a> | <a href="privacy.html" style="color: var(--primary); text-decoration: none; font-weight: bold;">Privacy</a> | <a href="support.html" style="color: var(--primary); text-decoration: none; font-weight: bold;">Support</a>
  </p>
</footer>

</body>
</html>
