<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | VyaparSync</title>
    <link rel="stylesheet" href="style.css?v=6">

  <meta name="theme-color" content="#ff6a00">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <script>if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');</script>
  <link rel="manifest" href="/manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body style="display: flex; flex-direction: column; min-height: 100dvh; margin: 0; padding: 0; box-sizing: border-box;">

    <a href="index.html" style="position: absolute; top: 25px; left: 25px; text-decoration: none; color: var(--text-main); font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 5px;">
        ⬅ Back to Market
    </a>

    <button onclick="toggleDark()" style="position: absolute; top: 15px; right: 25px; width: auto; padding: 8px 15px; background: var(--text-main); color: var(--bg-color);">🌙</button>

    <div class="auth-wrapper">
        <div class="auth-container" style="animation-delay: 0.1s;">
            <div class="auth-header">
                <h2>Join VyaparSync 🛍️</h2>
                <p>Create an account to track orders and save your cart.</p>
            </div>
            
            <form id="customerRegisterForm">
                <div class="input-group">
                    <input type="text" id="customerName" placeholder=" " required>
                    <label>Full Name</label>
                </div>

                <div class="input-group">
                    <input type="email" id="customerEmail" placeholder=" " required>
                    <label>Email Address</label>
                </div>
                
                <div class="input-group" style="margin-bottom: 30px;">
                    <input type="password" id="customerPassword" placeholder=" " required>
                    <label>Create Password</label>
                </div>
                
                
                
        <div style="margin-bottom: 20px; display: flex; align-items: start; gap: 10px; font-size: 13px; color: var(--text-muted); text-align: left;">
            <input type="checkbox" id="legalConsent" required style="margin-top: 3px; cursor: pointer;">
            <label for="legalConsent">I agree to the <a href="terms.html" style="color: var(--primary);">Terms of Service</a> and <a href="privacy.html" style="color: var(--primary);">Privacy Policy</a>.</label>
        </div>

                <button type="submit" class="auth-submit-btn">Create Account ✨</button>
            </form>

            <div class="auth-links" style="margin-top: 25px;">
                <p>Already have an account? <a href="login.html">Log In</a></p>
                <p style="margin-top: 10px; font-size: 12px;"><a href="retailer-register.html" style="color: var(--text-muted); font-weight: normal; text-decoration: underline;">Wait, I want to register as a seller instead.</a></p>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<script src="script.js?v=99"></script>


<footer style="background: var(--nav-bg); color: white; text-align: center; padding: 20px 5%; margin-top: auto;">
  <p style="margin: 0; font-size: 14px;">
    &copy; 2026 VyaparSync. All rights reserved. | <a href="about.html" style="color: var(--primary); text-decoration: none; font-weight: bold;">About / How it works</a> | <a href="terms.html" style="color: var(--primary); text-decoration: none; font-weight: bold;">Terms</a> | <a href="privacy.html" style="color: var(--primary); text-decoration: none; font-weight: bold;">Privacy</a> | <a href="support.html" style="color: var(--primary); text-decoration: none; font-weight: bold;">Support</a>
  </p>
</footer>

</body>
</html>
