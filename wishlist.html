<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Wishlist | VyaparSync</title>
  
  <link rel="stylesheet" href="style.css?v=6">
  
  <meta name="theme-color" content="#ff6a00">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <script>if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');</script>
  <link rel="manifest" href="/manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh;">

  <header class="header-top">
    <div class="header-logo-search">
      <h2>🛍 VyaparSync</h2>
    </div>
    <div class="nav-buttons">
      <a href="index.html" class="nav-btn">🏠 Home</a>
      <a href="orders.html" class="nav-btn orders">📦 Orders</a>
      <a href="cart.html" class="nav-btn cart">🛒 Cart</a>
      <button onclick="toggleDark()" class="nav-btn" style="background:#2d3436;">🌙 Dark</button>
    </div>
  </header>

  <main style="max-width: 1200px; margin: 0 auto; padding: 20px;">
    <!-- This div is required by loadWishlist() in script.js -->
    <div id="products">
        <p style="text-align: center; color: var(--text-muted); padding: 40px 0;">Loading your wishlist...</p>
    </div>
  </main>

  <div id="toast-container"></div>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
  <script src="script.js?v=99"></script>

  <script>
      // Load wishlist automatically when the page is loaded
      document.addEventListener('DOMContentLoaded', () => {
          if (typeof loadWishlist === 'function') {
              loadWishlist();
          }
      });
  </script>


<footer style="background: var(--nav-bg); color: white; text-align: center; padding: 20px 5%; margin-top: auto;">
  <p style="margin: 0; font-size: 14px;">
    &copy; 2026 VyaparSync. All rights reserved. | <a href="about.html" style="color: var(--primary); text-decoration: none; font-weight: bold;">About / How it works</a> | <a href="terms.html" style="color: var(--primary); text-decoration: none; font-weight: bold;">Terms</a> | <a href="privacy.html" style="color: var(--primary); text-decoration: none; font-weight: bold;">Privacy</a> | <a href="support.html" style="color: var(--primary); text-decoration: none; font-weight: bold;">Support</a>
  </p>
</footer>

</body>
</html>
