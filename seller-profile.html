<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seller Profile - VyaparSync</title>
  <link rel="stylesheet" href="style.css?v=13">
  <link rel="icon" type="image/png" href="/favicon.png">
  <script>if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');</script>
</head>
<body style="margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh;">

<header class="header-top">
  <div class="header-logo-search">
    <h2 style="cursor:pointer;" onclick="window.location.href='index.html'">🛍 VyaparSync</h2>
  </div>
  <div class="nav-buttons">
    <a href="index.html" class="nav-btn premium-btn" style="background: var(--card-bg); color: var(--text-main); border: 1px solid #ddd;">⬅ Back to Home</a>
  </div>
</header>

<main style="padding: 40px 5%; max-width: 1200px; margin: 0 auto; width: 100%; box-sizing: border-box;">
  
  <div id="seller-profile-header" style="background: var(--card-bg); border-radius: 12px; padding: 30px; box-shadow: var(--shadow); margin-bottom: 30px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap;">
    <div class="skeleton-img shimmer" style="width: 100px; height: 100px; border-radius: 50%;"></div>
    <div style="flex: 1;">
      <div class="skeleton-text shimmer" style="height: 30px; width: 200px; margin-bottom: 10px;"></div>
      <div class="skeleton-text shimmer" style="height: 15px; width: 150px; margin-bottom: 5px;"></div>
      <div class="skeleton-text shimmer" style="height: 15px; width: 100px;"></div>
    </div>
  </div>

  <h2 style="color: var(--text-main); margin-bottom: 20px;">Products from this Seller</h2>
  
  <div id="seller-products-grid" class="product-grid">
    <!-- Products will be injected here -->
  </div>

</main>

<script src="script.js?v=13"></script>
<script>
  // Add simple script to load seller details based on URL param ?shop=ShopName
  document.addEventListener("DOMContentLoaded", () => {
    const urlParams = new URLSearchParams(window.location.search);
    const shopName = urlParams.get('shop');
    
    if (shopName) {
      document.title = `${shopName} - VyaparSync`;
      fetch(`${API_URL}/products/shops/${shopName}`)
        .then(res => res.json())
        .then(productsData => {
            const products = Array.isArray(productsData) ? productsData : (productsData.products || []);
            currentProducts = products; // Sync with global
            
            // Build Header
            let shopMarket = products.length > 0 ? products[0].market : "Unknown Market";
            let retailerData = products.length > 0 ? products[0].retailerId : null;
            
            let badgeHtml = "";
            let trustScoreHtml = "";
            let joinedText = "";
            
            if (retailerData && retailerData.verificationTier === 'Premium') {
                badgeHtml = `<span title="Premium Seller" style="color: #f1c40f; font-size: 18px; margin-left: 5px;">💎 Premium</span>`;
            } else if (retailerData && retailerData.verificationTier === 'Verified') {
                badgeHtml = `<span title="Verified Seller" style="color: #3498db; font-size: 18px; margin-left: 5px;">✅ Verified</span>`;
            }
            if (retailerData && retailerData.trustScore) {
                trustScoreHtml = `<div style="font-size: 14px; color: #27ae60; font-weight: bold; margin-top: 10px;">Trust Score: ${retailerData.trustScore}/100</div>`;
            }
            if (retailerData && retailerData.date) {
                joinedText = `<div style="font-size: 12px; color: var(--text-muted); margin-top: 5px;">Joined: ${new Date(retailerData.date).toLocaleDateString()}</div>`;
            }

            document.getElementById("seller-profile-header").innerHTML = `
                <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(shopName)}&background=random&size=100" style="border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.1);" alt="${sanitizeHTML(shopName)}">
                <div style="flex: 1;">
                    <h1 style="margin: 0; color: var(--text-main); font-size: 28px;">${sanitizeHTML(shopName)} ${badgeHtml}</h1>
                    <div style="color: var(--text-muted); font-size: 16px; margin-top: 5px;">📍 ${sanitizeHTML(shopMarket)}</div>
                    ${trustScoreHtml}
                    ${joinedText}
                </div>
            `;
            
            // Build Products
            const grid = document.getElementById("seller-products-grid");
            grid.innerHTML = "";
            if (products.length === 0) grid.innerHTML = "<p>This shop hasn't added any products yet.</p>";
            products.forEach(p => {
                grid.innerHTML += createProductHTML(p);
            });
        })
        .catch(err => {
            document.getElementById("seller-profile-header").innerHTML = `<p>Error loading seller profile.</p>`;
        });
    } else {
        document.getElementById("seller-profile-header").innerHTML = `<p>Shop not specified.</p>`;
    }
  });
</script>

</body>
</html>
