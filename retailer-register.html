<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Vyaparsync</title>
    <link rel="stylesheet" href="style.css?v=6">
    <style>
        /* Hide the OTP step initially */
        #otpStep { display: none; } 
    </style>

  <meta name="theme-color" content="#ff6a00">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <script>if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');</script>
  <link rel="manifest" href="/manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body style="display: flex; flex-direction: column; min-height: 100dvh; margin: 0; padding: 0; box-sizing: border-box;">

    <a href="index.html" style="position: absolute; top: 25px; left: 25px; text-decoration: none; color: var(--text-main); font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 5px;">
        ⬅ Back to Market
    </a>

    <button onclick="toggleDark()" style="position: absolute; top: 15px; right: 25px; width: auto; padding: 8px 15px; background: var(--text-main); color: var(--bg-color); border: none; border-radius: 8px; cursor: pointer;">🌙</button>

    <div class="auth-wrapper">
        <div class="auth-container" style="animation-delay: 0.1s;">
            <div class="auth-header">
                <h2>Join Vyaparsync 🏪</h2>
                <p>Start selling to thousands of local customers instantly.</p>
            </div>
            
            <div id="detailsStep">
                <div class="input-group">
                    <input type="text" id="sellerName" placeholder=" " required>
                    <label>Full Name</label>
                </div>

                <div class="input-group">
                    <input type="email" id="sellerEmail" placeholder=" " required>
                    <label>Business Email</label>
                </div>

                <div class="input-group">
                    <input type="text" id="sellerShop" placeholder=" " required>
                    <label>Shop Name</label>
                </div>

                <div class="input-group" style="margin-bottom: 30px;">
                    <select id="sellerMarket" class="auth-select" required>
                        <option value="" disabled selected>📍 Select Your Market Area</option>
                        <optgroup label="Delhi NCR">
                            <option value="Chandni Chowk">Chandni Chowk</option>
                            <option value="Karol Bagh">Karol Bagh</option>
                            <option value="Lajpat Nagar">Lajpat Nagar</option>
                            <option value="Nehru Place">Nehru Place</option>
                            <option value="Palika Bazaar">Palika Bazaar</option>
                            <option value="Sadar Bazaar">Sadar Bazaar</option>
                            <option value="Sarojini Nagar">Sarojini Nagar</option>
                        </optgroup>
                        <optgroup label="Mumbai">
                            <option value="Colaba Causeway">Colaba Causeway</option>
                            <option value="Crawford Market">Crawford Market</option>
                            <option value="Linking Road">Linking Road</option>
                            <option value="Zaveri Bazaar">Zaveri Bazaar</option>
                        </optgroup>
                        <optgroup label="Bengaluru">
                            <option value="Brigade Road">Brigade Road</option>
                            <option value="Chickpet">Chickpet</option>
                            <option value="Commercial Street">Commercial Street</option>
                            <option value="Majestic Market">Majestic Market</option>
                        </optgroup>
                        <optgroup label="Jaipur">
                            <option value="Bapu Bazaar">Bapu Bazaar</option>
                            <option value="Johari Bazaar">Johari Bazaar</option>
                            <option value="Tripolia Bazaar">Tripolia Bazaar</option>
                        </optgroup>
                        <optgroup label="Kolkata">
                            <option value="Bara Bazaar">Bara Bazaar</option>
                            <option value="Gariahat Market">Gariahat Market</option>
                            <option value="New Market">New Market</option>
                        </optgroup>
                        <optgroup label="Chennai">
                            <option value="George Town">George Town</option>
                            <option value="Pondy Bazaar">Pondy Bazaar</option>
                            <option value="T. Nagar">T. Nagar</option>
                        </optgroup>
                        <optgroup label="Hyderabad">
                            <option value="Begum Bazaar">Begum Bazaar</option>
                            <option value="Charminar Market">Charminar Market</option>
                            <option value="Laad Bazaar">Laad Bazaar</option>
                        </optgroup>
                        <optgroup label="Other">
                            <option value="Other">Other (Unlisted Market)</option>
                        </optgroup>
                    </select>
                </div>
                
                
        <div style="margin-bottom: 20px; display: flex; align-items: start; gap: 10px; font-size: 13px; color: var(--text-muted); text-align: left;">
            <input type="checkbox" id="legalConsent" style="margin-top: 3px; cursor: pointer;">
            <label for="legalConsent">I agree to the <a href="terms.html" style="color: var(--primary);">Terms of Service</a> and <a href="privacy.html" style="color: var(--primary);">Privacy Policy</a>.</label>
        </div>
                <button onclick="requestSellerOTP()" class="auth-submit-btn" id="sendBtn">Verify Email & Create Account ✨</button>

                <div class="auth-links">
                    <p>Already a partner? <a href="login.html">Log In</a></p>
                </div>
            </div>

            <div id="otpStep" style="text-align: center;">
                <p style="color: var(--text-muted); margin-bottom: 20px;">We sent a 6-digit secure code to <br><b id="displayEmail" style="color: var(--text-main);"></b></p>
                
                <div class="input-group" style="margin-bottom: 30px;">
                    <input type="text" id="sellerOTP" placeholder="• • • • • •" maxlength="6" autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]*" style="letter-spacing: 8px; font-size: 24px; font-weight: bold; text-align: center;" required>
                </div>

                <button onclick="verifySellerOTP()" class="auth-submit-btn" id="verifyBtn">Verify & Open Dashboard 🚀</button>
                
                <button onclick="window.location.reload()" style="background: none; border: none; color: var(--primary); margin-top: 20px; cursor: pointer; text-decoration: underline; font-weight: bold;">Use a different email</button>
            </div>

        </div>
    </div>

    <div id="toast-container"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<script src="script.js?v=99"></script>
